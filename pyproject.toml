[project]
name = "trnopt"
version = "0.1.0"
description = "PDLP-style LP solving in PyTorch, as a stepping stone toward AWS Trainium"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "highspy>=1.7",
]

[project.optional-dependencies]
pyomo = ["pyomo>=6.9"]        # SolverFactory("trnopt") via `import trnopt.pyomo_plugin`
heuristics = ["numba>=0.60"]  # Feasibility Jump (trnopt.fj)

[project.scripts]
trnopt-bench = "trnopt.bench:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trnopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
